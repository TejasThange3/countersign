# Local development services. App services (mcp-server, agent, dashboard) are added
# by their lanes as they become runnable; the final file must bring up the whole stack.
#   docker compose -f infra/docker-compose.yml up -d
name: countersign

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: countersign
      POSTGRES_PASSWORD: countersign
      POSTGRES_DB: countersign
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U countersign -d countersign"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
