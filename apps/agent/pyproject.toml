[project]
name = "countersign-agent"
version = "0.1.0"
description = "Countersign voice agent: Pipecat pipeline plus the ArmorIQ bridge on the tool path."
readme = "README.md"
authors = [
    { name = "Tejas Thange", email = "142657235+TejasThange3@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "armoriq-sdk==0.6.10",
    "fastapi>=0.115",
    "fastmcp>=4.1,<5",
    "httpx>=0.27",
    "pipecat-ai-small-webrtc-prebuilt>=2.5.0",
    "pipecat-ai[elevenlabs,google,local-smart-turn,silero,webrtc,whisper]==1.12.0",
    "pydantic>=2",
    "pydantic-settings>=2",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
countersign-agent = "countersign_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs local Docker services (Postgres, Redis)",
    "live: calls real external services (ArmorIQ, ElevenLabs, Gemini); never mocked",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
