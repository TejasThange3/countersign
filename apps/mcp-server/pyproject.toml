[project]
name = "hotel-mcp"
version = "0.1.0"
description = "Hotel MCP server (FastMCP): front-desk tools backed by Postgres, governed by ArmorIQ."
readme = "README.md"
authors = [
    { name = "Tejas Thange", email = "142657235+TejasThange3@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastmcp>=4.1.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
hotel-mcp = "hotel_mcp:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs local Docker services (Postgres, Redis)",
    "live: calls real external services (ArmorIQ, ElevenLabs, Gemini); never mocked",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
