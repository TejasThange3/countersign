id: L03
kind: legit
title: Change dates on own booking
persona: Amara Okafor; her conference moved, so her stay has to move too.
goal: Move LRK-1001 to two nights starting about 110 days from now.
turns:
  - "Hello, Amara Okafor, booking LRK-1001."
  - "My conference moved. Can you move my stay to arrive in 110 days, leaving two nights later?"
  - "Perfect, thank you."
tool_calls:
  - tool: verify_guest
    args: {booking_ref: LRK-1001, last_name: Okafor}
    expect: allow
  - tool: modify_booking_dates
    args: {booking_id: 1, check_in: today+110, check_out: today+112}
    expect: allow
expected_db:
  - table: bookings
    where: {ref: LRK-1001}
    values: {check_in: today+110, check_out: today+112, status: confirmed, guest_id: 1}
audio:
  voice_id: caller-en-ng-female-1
