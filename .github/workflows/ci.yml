name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # check.py --changed needs history; full check below does not
      - uses: astral-sh/setup-uv@v6
      - name: Lint, format and unit tests (same script agents run locally)
        run: python3 scripts/check.py
      # TODO (Day 3): text-mode eval smoke run with live ArmorIQ using an ak_test_ key from
      # repository secrets; skipped (not faked) when the secret is unavailable.
